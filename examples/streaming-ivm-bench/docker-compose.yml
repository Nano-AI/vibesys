# Shared infrastructure for the live-engine baselines (TASKS.md 1.8-1.10).
#
#   kafka          -- the fair ingestion substrate (CONTRACT.md §1). Single KRaft broker.
#   risingwave     -- RisingWave baseline (1.10); psql on :4566.
#   flink-*        -- Flink baseline (1.9); Web UI on :8081, SQL client via profile.
#
# The Python harness (load_driver.py, checker.py, benchmark.py) runs on the HOST and talks
# to Kafka on localhost:9092. Bring up only what a run needs, e.g.:
#
#   docker compose up -d kafka                 # then: python3 load_driver.py --to kafka ...
#   docker compose up -d risingwave            # baselines/risingwave/README.md
#   docker compose up -d flink-jobmanager flink-taskmanager
#   docker compose run --rm flink-sql-client   # baselines/flink/README.md
#
# NOTE: correctness runs use 1 partition, throughput runs 8 (CONTRACT.md §1); the load
# driver creates the topic with the partition count you pass via --partitions.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sib-kafka
    ports:
      - "29092:29092"          # HOST listener: host tools use localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Dual listeners: INTERNAL for other containers (kafka:9092), HOST for the host
      # (localhost:29092). A single advertised listener cannot serve both.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # --- RisingWave baseline (1.10) : psql-compatible on :4566 ---
  risingwave:
    image: risingwavelabs/risingwave:v2.1.0
    container_name: sib-risingwave
    command: ["standalone", "--prometheus-listener-addr", "0.0.0.0:1250"]
    ports:
      - "4566:4566"      # psql wire protocol (SQL)
    depends_on:
      kafka:
        condition: service_healthy

  # --- Flink baseline (1.9) : Web UI on :8081 ---
  flink-jobmanager:
    image: flink:1.20.0-scala_2.12-java11
    container_name: sib-flink-jm
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./baselines/flink:/opt/sql          # SQL scripts
      - ./baselines/flink/lib:/opt/flink/lib/ext   # drop the kafka SQL connector jar here

  flink-taskmanager:
    image: flink:1.20.0-scala_2.12-java11
    container_name: sib-flink-tm
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./baselines/flink/lib:/opt/flink/lib/ext

  # SQL client (run on demand): docker compose run --rm flink-sql-client
  flink-sql-client:
    image: flink:1.20.0-scala_2.12-java11
    depends_on:
      - flink-jobmanager
    entrypoint: ["/opt/flink/bin/sql-client.sh", "-f", "/opt/sql/metering.sql"]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./baselines/flink:/opt/sql
      - ./baselines/flink/lib:/opt/flink/lib/ext
    profiles: ["tools"]
